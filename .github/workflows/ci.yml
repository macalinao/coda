name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Coda loads coda.config.ts via native Node.js type stripping, which
      # requires Node >= 22.18 / 24. Pin a supported version for the native
      # config-load verification step below.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tooling only; the generated clients are built after codegen below.
      - name: Build all packages
        run: bun run build:ci

      # build:ci excludes apps/docs, and bun install does not run the
      # apps/docs postinstall, so the Next.js typegen output (.next/types,
      # which declares the global LayoutProps/PageProps, and .source) is
      # absent. Type-aware lint over apps/docs needs it, so generate it here.
      - name: Generate docs route types (needed for type-aware lint)
        run: bun run typegen
        working-directory: apps/docs

      # oxlint runs with typeAware + typeCheck, so this both lints and
      # type-checks every package and every programs/**/*.ts config (the
      # `programs` workspace package). The build above produces the .d.ts
      # files tsgolint needs to resolve @macalinao/coda and
      # @macalinao/megagraph from the configs. oxfmt --check enforces
      # formatting.
      - name: Run oxlint (lint + type-check) and check formatting
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Typecheck the create-coda template config
        run: bun run typecheck

      # The Typedoc Docs workflow only runs on push to master, so a dependency
      # bump that breaks TypeDoc (e.g. a TypeScript major it does not support)
      # would otherwise pass PR CI and only fail after merge.
      - name: Build TypeDoc API docs
        run: bun run typedoc --emit none

      # graph/ and clients/ are not committed: generate them here. The graph
      # step runs under `node` directly (not bun), so every program config
      # must also load via native type stripping. The generated clients are
      # the integration test of the tooling: they must build, type-check and
      # load.
      - name: Generate graph/ and clients/
        run: |
          node scripts/megagraph.ts graph
          bun scripts/megagraph.ts generate
          bun scripts/clients.ts install

      - name: Check codegen is idempotent
        run: |
          before="$(bun scripts/clients.ts fingerprint)"
          bun scripts/megagraph.ts graph
          bun scripts/megagraph.ts generate
          bun scripts/clients.ts install
          after="$(bun scripts/clients.ts fingerprint)"
          echo "first:  $before"
          echo "second: $after"
          test "$before" = "$after"

      - name: Build the generated clients
        run: bun scripts/clients.ts build

      - name: Typecheck the generated clients
        run: bun scripts/clients.ts typecheck

      - name: Load every generated client
        run: bun scripts/clients.ts test

      # Enforce the bundle-size budgets in .size-limit.json. The @solana/*
      # peer deps are ignored, so these measure each client's own cost. Two
      # entries per client: a single instruction (the tree-shaken path almost
      # every consumer takes) and the full `export *` ceiling. A codegen or
      # renderer change that breaks tree-shaking blows the per-instruction
      # budget long before the full-client one moves.
      - name: Check client bundle sizes
        run: bun run size
