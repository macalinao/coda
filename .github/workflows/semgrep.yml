name: Semgrep

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "31 5 * * 1"

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep==1.170.0

      # No SEMGREP_APP_TOKEN needed — these registry rulesets are free.
      # continue-on-error keeps the SARIF upload running when findings exist
      # (semgrep exits non-zero) while genuine failures still surface in the UI.
      - name: Run Semgrep
        continue-on-error: true
        run: >
          semgrep scan
          --config p/default
          --config p/typescript
          --config p/security-audit
          --config p/secrets
          --sarif --output semgrep.sarif

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v3
        with:
          sarif_file: semgrep.sarif
